# Studio router + lead API (Phase 2–3). Deploy separately from Pages root wrangler.toml.
# Slice A: local dev only — no production routes until Slice B/D.

name = "altrudigitech-studio-worker"
main = "src/index.js"
compatibility_date = "2024-11-16"

[vars]
PAGES_ORIGIN = "https://altrudigitech.com"
RESEND_FROM = "AltruDigiTech <hello@altrudigitech.com>"

# Client subdomains — apex HTML stays on Pages.
[[routes]]
pattern = "*.altrudigitech.com/*"
zone_name = "altrudigitech.com"

# Slice D: lead API on apex only (not full apex passthrough).
[[routes]]
pattern = "altrudigitech.com/api/*"
zone_name = "altrudigitech.com"